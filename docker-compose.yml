services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: literature-recommender:latest
    container_name: literature_api
    command: uvicorn literature_recommender.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./weights:/app/weights
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/info || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    image: literature-recommender:latest
    container_name: literature_frontend
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./weights:/app/weights
    restart: unless-stopped